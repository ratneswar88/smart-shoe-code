<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ESP32 Sensor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            color: #333;
            margin: 20px;
        }
        h1 {
            text-align: center;
            color: #222;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 30px;
            margin-top: 30px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            width: 300px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        canvas {
            max-width: 100%;
        }
        .value {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            color: #0077b6;
        }
    </style>
</head>
<body>
    <h1>MADEPLUS SMART SHOE Dashboard</h1>
    <div class="container">
        <div class="card">
            <div class="value" id="stepsValue">0 Steps</div>
            <canvas id="stepsChart"></canvas>
        </div>

        <div class="card">
            <div class="value" id="tempValue">Temperature: 0 °C</div>
            <canvas id="tempChart"></canvas>
        </div>

        <div class="card">
            <div class="value" id="pressureValue">Pressure: 0 hPa</div>
            <canvas id="pressureChart"></canvas>
        </div>

        <div class="card">
            <div class="value" id="orientationValue">Roll: 0°, Pitch: 0°, Yaw: 0°</div>
            <canvas id="orientationChart"></canvas>
        </div>
    </div>

<script>
    const MAX_POINTS = 30;

    // Store data arrays for charts
    const dataStore = {
        steps: [],
        temperature: [],
        pressure: [],
        roll: [],
        pitch: [],
        yaw: [],
        labels: []
    };

    // Setup time labels (will update)
    function updateLabels() {
        const now = new Date();
        let labels = [];
        for(let i = MAX_POINTS-1; i >= 0; i--) {
            const time = new Date(now - i*1000);
            labels.push(time.toLocaleTimeString());
        }
        dataStore.labels = labels;
    }
    updateLabels();

    // Create charts
    const stepsCtx = document.getElementById('stepsChart').getContext('2d');
    const stepsChart = new Chart(stepsCtx, {
        type: 'line',
        data: {
            labels: dataStore.labels,
            datasets: [{
                label: 'Steps',
                data: dataStore.steps,
                borderColor: '#ff7f50',
                backgroundColor: '#ff7f5055',
                fill: true,
                tension: 0.4,
                pointRadius: 0
            }]
        },
        options: {
            animation: false,
            scales: { y: { beginAtZero: true } }
        }
    });

    const tempCtx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(tempCtx, {
        type: 'line',
        data: {
            labels: dataStore.labels,
            datasets: [{
                label: 'Temperature (°C)',
                data: dataStore.temperature,
                borderColor: '#ff6347',
                backgroundColor: '#ff634755',
                fill: true,
                tension: 0.4,
                pointRadius: 0
            }]
        },
        options: {
            animation: false,
            scales: { y: { beginAtZero: false } }
        }
    });

    const pressureCtx = document.getElementById('pressureChart').getContext('2d');
    const pressureChart = new Chart(pressureCtx, {
        type: 'line',
        data: {
            labels: dataStore.labels,
            datasets: [{
                label: 'Pressure (hPa)',
                data: dataStore.pressure,
                borderColor: '#4682b4',
                backgroundColor: '#4682b455',
                fill: true,
                tension: 0.4,
                pointRadius: 0
            }]
        },
        options: {
            animation: false,
            scales: { y: { beginAtZero: false } }
        }
    });

    const orientationCtx = document.getElementById('orientationChart').getContext('2d');
    const orientationChart = new Chart(orientationCtx, {
        type: 'line',
        data: {
            labels: dataStore.labels,
            datasets: [
                {
                    label: 'Roll (°)',
                    data: dataStore.roll,
                    borderColor: '#8a2be2',
                    fill: false,
                    tension: 0.4,
                    pointRadius: 0
                },
                {
                    label: 'Pitch (°)',
                    data: dataStore.pitch,
                    borderColor: '#ff1493',
                    fill: false,
                    tension: 0.4,
                    pointRadius: 0
                },
                {
                    label: 'Yaw (°)',
                    data: dataStore.yaw,
                    borderColor: '#00ced1',
                    fill: false,
                    tension: 0.4,
                    pointRadius: 0
                }
            ]
        },
        options: {
            animation: false,
            scales: { y: { beginAtZero: false } }
        }
    });

    // Update UI text and charts with new data
    function updateDataUI(data) {
        document.getElementById('stepsValue').innerText = `${data.steps} Steps`;
        document.getElementById('tempValue').innerText = `Temperature: ${data.temperature.toFixed(2)} °C`;
        document.getElementById('pressureValue').innerText = `Pressure: ${data.pressure.toFixed(2)} hPa`;
        document.getElementById('orientationValue').innerText = 
            `Roll: ${data.roll.toFixed(2)}°, Pitch: ${data.pitch.toFixed(2)}°, Yaw: ${data.yaw.toFixed(2)}°`;

        // Push new data points to arrays
        if(dataStore.steps.length >= MAX_POINTS) {
            dataStore.steps.shift();
            dataStore.temperature.shift();
            dataStore.pressure.shift();
            dataStore.roll.shift();
            dataStore.pitch.shift();
            dataStore.yaw.shift();
            dataStore.labels.shift();
        }

        // Add current time label
        const now = new Date();
        dataStore.labels.push(now.toLocaleTimeString());

        dataStore.steps.push(data.steps);
        dataStore.temperature.push(data.temperature);
        dataStore.pressure.push(data.pressure);
        dataStore.roll.push(data.roll);
        dataStore.pitch.push(data.pitch);
        dataStore.yaw.push(data.yaw);

        // Update charts
        stepsChart.update();
        tempChart.update();
        pressureChart.update();
        orientationChart.update();
    }

    // Poll server for latest data every second
    setInterval(() => {
        fetch('/data')
            .then(response => response.json())
            .then(data => updateDataUI(data))
            .catch(err => console.error('Error fetching data:', err));
    }, 1000);

</script>
</body>
</html>
