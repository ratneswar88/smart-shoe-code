name: shoeml_train
description: MADEPLUS ShoeML Trainer (BLE streaming, live metrics, training, CSV saving, model manager)
publish_to: "none"

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE + permissions + system settings
  flutter_reactive_ble: any
  permission_handler: any
  app_settings: any

  # Charts & UI helpers
  fl_chart: any

  # Files, dates, sharing, prefs
  path_provider: any
  intl: any
  shared_preferences: any
  share_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/madeplus_logo.png
